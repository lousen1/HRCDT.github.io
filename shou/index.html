<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ec">
  <meta name="description" content="记录每日早晚体重、卡路里与训练进度">
  <title>瘦 · 体重与训练记录</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo">瘦</div>
      <div class="brand"><h1>瘦</h1><p>每一天，都更靠近自己</p></div>
      <label class="date-box"><span>日期</span><input id="date" type="date"></label>
    </header>

    <section id="record" class="page active">
      <article class="hero">
        <span class="eyebrow">最近体重</span>
        <div class="weight"><b id="latestWeight">--</b><small>kg</small></div>
        <span id="change" class="change">开始记录</span>
        <div class="orbit"><i></i></div>
      </article>

      <form id="recordForm" class="card form-card">
        <div class="card-head"><div><span class="eyebrow lime">TODAY</span><h2 id="recordTitle">今日记录</h2></div><span id="recordStatus" class="status">待记录</span></div>
        <div class="fields">
          <label><span class="field-icon sun">◔</span><span class="field-copy"><b>早晨体重</b><small>起床空腹后</small></span><input id="morning" type="number" inputmode="decimal" min="20" max="300" step="0.1" placeholder="--"><em>kg</em></label>
          <label><span class="field-icon moon">◑</span><span class="field-copy"><b>晚间体重</b><small>睡前记录</small></span><input id="evening" type="number" inputmode="decimal" min="20" max="300" step="0.1" placeholder="--"><em>kg</em></label>
          <label><span class="field-icon fire">♨</span><span class="field-copy"><b>今日摄入</b><small>手动输入总热量</small></span><input id="calories" type="number" inputmode="numeric" min="0" max="10000" step="1" placeholder="--"><em>kcal</em></label>
        </div>
        <button id="saveBtn" class="save" type="submit">保存今日记录</button>
      </form>

      <button id="goWorkout" class="mini-card"><span id="miniRing" class="ring"><b id="miniDone">0</b><small>/7</small></span><span><b>今日训练</b><small id="miniText">还有 7 项，一点点来</small></span><i>→</i></button>
    </section>

    <section id="trend" class="page">
      <div class="title"><span class="eyebrow lime">PROGRESS</span><h2>变化趋势</h2><p>看见每一次坚持留下的痕迹</p></div>
      <article class="card chart-card">
        <div class="chart-head"><div><b>体重曲线</b><small>近 14 次记录</small></div><div class="legend"><i></i>早晨<i></i>晚间</div></div>
        <canvas id="chart"></canvas>
        <div id="chartEmpty" class="empty">记录体重后，这里会出现变化曲线</div>
      </article>
      <div class="stats"><div><span>开始体重</span><b id="startWeight">--</b><small>kg</small></div><div><span>最近变化</span><b id="totalChange">--</b><small>kg</small></div><div><span>记录天数</span><b id="recordDays">0</b><small>天</small></div></div>
      <article class="card history"><h3>最近记录</h3><div id="historyList"></div></article>
    </section>

    <section id="workout" class="page">
      <div class="workout-head"><div><span class="eyebrow lime">WORKOUT</span><h2>今日训练</h2><p id="workoutDate"></p></div><div><b id="score">0</b><small>%</small></div></div>
      <div class="progress"><i id="progressBar"></i></div>
      <div id="workoutList" class="workouts"></div>
      <p id="encouragement" class="encouragement">不用一次完成所有，保持呼吸，按你的节奏来。</p>
    </section>

    <nav class="nav" aria-label="主导航">
      <button data-page="record" class="active"><span>▣</span><b>记录</b></button>
      <button data-page="trend"><span>⌯</span><b>趋势</b></button>
      <button data-page="workout"><span>◇</span><b>训练</b></button>
    </nav>
  </main>
  <script src="./app.js"></script>
</body>
</html>
